<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zodiac Fut</title>
<link rel="icon" href="index.icon.png">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1B2C">
<style>
/* Página de teste: só o jogo em tela cheia e uma tela de carregamento. */
:root{ --sky:#0E1B2C; --ink:#0E1B2C; --sun:#E8B931; --card:#F4EAD2; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#0E1B2C; --ink:#0E1B2C; --card:#F4EAD2; } }
:root[data-theme="dark"]{ --sky:#0E1B2C; --ink:#0E1B2C; --card:#F4EAD2; }
html,body{margin:0;height:100%;background:var(--sky);overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
#canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body,#status{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#canvas:focus{outline:none}
#status{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--sky);padding:16px;text-align:center;transition:opacity .45s ease}
#status.out{opacity:0;pointer-events:none}
#status h1{margin:0;font-size:34px;color:#E8B931;letter-spacing:2px}
.bar{width:min(320px,80vw);height:10px;background:rgba(244,234,210,.18);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .2s}
#msg{font-weight:600;font-size:17px;color:#F4EAD2;letter-spacing:1px;max-width:360px}
#pct{color:#E8B931;font-variant-numeric:tabular-nums}
#rot{position:fixed;left:0;right:0;top:12px;margin:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px;display:none;z-index:5}
@media (orientation: portrait){ #rot.on{display:block} }
body.mesa #rot{display:none !important}
</style>
</head>
<body>
<canvas id="canvas">Seu navegador não suporta o jogo.</canvas>
<div id="rot">Deite o celular para jogar</div>
<div id="status">
  <div id="msg">Carregando <span id="pct">0%</span></div>
  <div class="bar"><i id="fill"></i></div>
</div>

<script>
function zfProgress(v) {
  const p = Math.max(0, Math.min(100, Math.round(v)));
  const f = document.getElementById('fill'), t = document.getElementById('pct');
  if (f) f.style.width = p + '%';
  if (t) t.textContent = p + '%';
}
window.zfProgress = zfProgress;
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":33707572,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const fill = document.getElementById('fill'), msg = document.getElementById('msg'), status = document.getElementById('status');
const rot = document.getElementById('rot');
function fail(e) { console.error(e); msg.style.fontSize = '15px'; msg.textContent = 'Não foi possível abrir o jogo: ' + (e && e.message ? e.message : e); }
try {
  const missing = Engine.getMissingFeatures({threads: false});
  if (missing.length) { fail('faltam recursos no navegador (' + missing.join(', ') + ')'); }
  else {
    const engine = new Engine(GODOT_CONFIG);
    engine.startGame({
      onProgress: (cur, total) => { if (total > 0) zfProgress(cur / total * 100); },
    }).then(() => { window.zfProgress(100); status.classList.add('out'); setTimeout(() => status.remove(), 500); rot.classList.add('on'); }, fail);
  }
} catch (e) { fail(e); }
</script>
